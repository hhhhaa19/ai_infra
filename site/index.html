<title>AI Infra 学习日志</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：顶部固定导航切换 总览、6 个笔记分组（部署与工程 / GPU 与性能 / 端侧部署 / 核心算子 / LLM 推理 / 论文）、源码与报告、刷题；正文单栏，笔记视图左侧模块列表。
   主题：硅片蓝灰底 + 信号蓝强调；琥珀色只用于"后来被修正 / 需要注意"；绿色只用于"已完成 / 已掌握"。 */
:root {
  --bg: #f4f6f9; --panel: #ffffff; --ink: #17202c; --muted: #586374; --line: #d9dfe8;
  --accent: #2552c8; --accent-soft: #e6ecfb; --amber: #9a5b00; --amber-soft: #fbf0dc;
  --good: #1f7a4d; --good-soft: #e2f3ea; --code-bg: #eef1f6;
  --bar-mlp: #2552c8; --bar-attn: #7f9be6; --bar-norm: #d98a1e; --bar-other: #a7b0bd;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #161d27; --ink: #e5eaf1; --muted: #9aa6b6; --line: #273141;
    --accent: #8cabff; --accent-soft: #1d2a47; --amber: #f0b45a; --amber-soft: #33270f;
    --good: #6fd29e; --good-soft: #13301f; --code-bg: #1c2532;
    --bar-mlp: #8cabff; --bar-attn: #4c6bb8; --bar-norm: #f0b45a; --bar-other: #5d6878;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #161d27; --ink: #e5eaf1; --muted: #9aa6b6; --line: #273141;
  --accent: #8cabff; --accent-soft: #1d2a47; --amber: #f0b45a; --amber-soft: #33270f;
  --good: #6fd29e; --good-soft: #13301f; --code-bg: #1c2532;
  --bar-mlp: #8cabff; --bar-attn: #4c6bb8; --bar-norm: #f0b45a; --bar-other: #5d6878;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.75; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--f-mono); font-size: 0.88em; }
:not(pre) > code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.6; margin: 0; }
pre code { font-size: inherit; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; max-width: 74ch; }

/* 顶部导航 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.brand { font-family: var(--f-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; white-space: nowrap; color: var(--ink); text-decoration: none; }
.brand span { color: var(--accent); }
nav.views { display: flex; gap: 4px; overflow-x: auto; min-width: 0; }
nav.views a { padding: 6px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
nav.views a:hover { color: var(--ink); background: var(--code-bg); }
nav.views a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 72px; }
.view { display: grid; gap: 48px; }
section { min-width: 0; display: grid; gap: 16px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 72px); }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(30px, 5vw, 44px); letter-spacing: 0.01em; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
h3 { font-size: 16.5px; font-weight: 700; }
h4 { font-size: 14.5px; font-weight: 700; }
.lede { font-size: 16.5px; color: var(--muted); max-width: 70ch; }
.formula { font-family: var(--f-mono); font-size: 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; overflow-x: auto; white-space: nowrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.note { border-left: 3px solid var(--amber); background: var(--amber-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; max-width: 80ch; }
.note.good { border-left-color: var(--good); background: var(--good-soft); }
ul.plain, ol.plain { margin: 0; padding-left: 1.25em; display: grid; gap: 6px; max-width: 76ch; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12.5px; background: var(--code-bg); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.win { color: var(--good); font-weight: 700; }
td.sub { background: var(--code-bg); font-weight: 600; }
.src { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.src::before { content: "↗ "; }

.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap; vertical-align: 2px; }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.now { background: var(--accent-soft); color: var(--accent); }
.pill.plan { background: var(--code-bg); color: var(--muted); }
.pill.fix { background: var(--amber-soft); color: var(--amber); }

/* 总览 */
.status { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.status .panel h3 { display: flex; gap: 8px; align-items: baseline; }
.phase { display: grid; gap: 14px; }
.phase-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.phase-head h3 { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tasks li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.tasks li .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.tasks li .t { display: grid; gap: 4px; min-width: 0; }
.tasks li .t h4 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
#route .grid3 { align-items: start; }
#route .phase { align-content: start; gap: 10px; }
#route .phase-head h3 { font-size: 17px; }

/* 日志 */
.log-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.log-tools input[type=search] { font: inherit; font-size: 14px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 0; flex: 1 1 220px; max-width: 360px; }
.chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.log li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.log li .d { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.log li .b { display: grid; gap: 4px; min-width: 0; }
.log li .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.log li .tags span { font-family: var(--f-mono); font-size: 11px; color: var(--accent); }

/* 笔记 */
.notes-shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
.mod-list { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 4px; }
.mod-list button { font: inherit; font-size: 13.5px; text-align: left; padding: 8px 12px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; line-height: 1.45; }
.mod-list button:hover { background: var(--code-bg); color: var(--ink); }
.mod-list button[aria-pressed="true"] { background: var(--panel); border-color: var(--line); color: var(--accent); font-weight: 600; }
.mod-list .grp { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--muted); padding: 10px 12px 2px; }
article.mod { display: grid; gap: 18px; min-width: 0; }
article.mod h2 { border-bottom: 0; padding-bottom: 0; }
article.mod .why { font-size: 15.5px; }
article.mod .blk { display: grid; gap: 10px; }
article.mod .blk > h3 { padding-left: 10px; border-left: 3px solid var(--accent); }
.selftest { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 14px 18px; display: grid; gap: 8px; }
.selftest h3 { font-size: 15px; }

/* RMSNorm 专题 */
.subnav { display: flex; flex-wrap: wrap; gap: 6px; }
.subnav a { font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--muted); background: var(--panel); }
.subnav a:hover { color: var(--accent); border-color: var(--accent); }
.script ol { margin: 0; padding-left: 1.4em; display: grid; gap: 10px; }
.script li::marker { font-family: var(--f-mono); color: var(--accent); font-weight: 600; }
.script .beat { font-weight: 700; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; counter-reset: step; }
.timeline > li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 22px; }
.timeline > li::before { counter-increment: step; content: counter(step); font-family: var(--f-mono); font-size: 12px; font-weight: 600; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); background: var(--bg); display: grid; place-items: center; z-index: 1; }
.timeline > li::after { content: ""; position: absolute; left: 13.5px; top: 28px; bottom: 0; width: 1.5px; background: var(--line); }
.timeline > li:last-child::after { display: none; }
.timeline .body { display: grid; gap: 6px; min-width: 0; }
.timeline .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }
.stack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.stack span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.cmp { display: grid; gap: 10px; }
.cmp .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.cmp .row > div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; min-width: 0; }
.cmp .row > div.fix { border-color: var(--amber); }
.tag { display: inline-block; font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
.tag.keep { background: var(--good-soft); color: var(--good); }
.tag.fix { background: var(--amber-soft); color: var(--amber); }
.tag.add { background: var(--accent-soft); color: var(--accent); }
.qa-list { display: grid; gap: 10px; }
details.qa { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
details.qa summary { cursor: pointer; list-style: none; padding: 12px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
details.qa summary::-webkit-details-marker { display: none; }
details.qa summary .topic { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
details.qa summary .q { font-weight: 600; }
details.qa summary .mark { font-size: 12px; color: var(--good); white-space: nowrap; }
details.qa[open] summary { border-bottom: 1px solid var(--line); }
details.qa .a { padding: 12px 16px 14px; display: grid; gap: 10px; font-size: 14.5px; }
details.qa .a ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
details.qa .a label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
details.qa.done { border-color: var(--good); }

@media (max-width: 900px) {
  .wrap { padding-block: 20px 56px; }
  .grid2, .grid3, .status, .cmp .row { grid-template-columns: minmax(0, 1fr); }
  .notes-shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .mod-list { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .mod-list .grp { display: none; }
  .mod-list button { white-space: nowrap; }
  .log li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .brand { display: none; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* 11-07 新增：模块 11 的交互动画、面试要求块 */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.anim { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: block; min-width: 0; color: var(--ink); }
.anim svg { display: block; max-width: 100%; height: auto; font-family: var(--f-body); font-size: 12px; overflow: visible; }
.anim button { font: inherit; font-size: 13px; line-height: 1.4; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer; }
.anim button:hover { border-color: var(--accent); }
.anim input[type=range] { accent-color: var(--accent); min-width: 60px; }
.anim label { font-size: 14px; }
.iv h4 { margin-top: 4px; color: var(--accent); }
.iv ul.plain { margin-bottom: 2px; }
code.path { overflow-wrap: anywhere; word-break: break-all; }
/* 左侧模块列表：比屏幕高时可单独滚动 */
@media (min-width: 901px) { .mod-list { max-height: calc(100vh - env(safe-area-inset-top, 0px) - 88px); max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 88px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; } }

/* 11-07 新增：左侧模块列表的分组、编号和选中状态 */
.mod-list .grp { color: var(--accent); opacity: 0.85; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; }
.mod-list .grp:first-child { border-top: 0; margin-top: 0; padding-top: 2px; }
.mod-list button { display: flex; align-items: center; gap: 10px; border-left: 3px solid transparent; }
.mod-list button .mnum { flex: none; min-width: 26px; height: 22px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--muted); }
.mod-list button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; border-left-color: var(--accent); color: var(--ink); }
.mod-list button[aria-pressed="true"] .mnum { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
.mod-list button:hover .mnum { color: var(--ink); }

/* 11-09 新增：刷题视图（LeetCode 热题 100） */
.lc-top { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.lc-stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.lc-stat .k { font-size: 12.5px; color: var(--muted); }
.lc-stat .v { font-family: var(--f-mono); font-size: 22px; font-weight: 600; }
.lc-bar { height: 10px; border-radius: 999px; background: var(--code-bg); border: 1px solid var(--line); overflow: hidden; position: relative; }
.lc-bar i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 999px; }
.lc-bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--amber); }
.lc-cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.lc-cat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.lc-cat h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
.lc-cat h3 span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 500; }
.lc-item { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 14px; padding: 3px 0; }
.lc-item input { width: 16px; height: 16px; accent-color: var(--good); margin: 0; cursor: pointer; }
.lc-item input:disabled { cursor: default; }
.lc-item .no { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 34px; text-align: right; }
.lc-item a { color: var(--ink); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-item a:hover { color: var(--accent); text-decoration: underline; }
.lc-item.done a { color: var(--muted); text-decoration: line-through; }
.lc-item .at { font-family: var(--f-mono); font-size: 11.5px; color: var(--good); }
.lc-d { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; }
.lc-d.E { background: var(--good-soft); color: var(--good); }
.lc-d.M { background: var(--amber-soft); color: var(--amber); }
.lc-d.H { background: #fde3e3; color: #b42318; }
:root[data-theme="dark"] .lc-d.H { background: #3a1616; color: #ff8a80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lc-d.H { background: #3a1616; color: #ff8a80; } }
@media (max-width: 900px) { .lc-top { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lc-cats { grid-template-columns: minmax(0, 1fr); } }

/* 笔记分组导航 + 可读性 */
[hidden]:not([hidden=until-found i]) { display: none !important; }
.mod-list button > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.mod-toc { display: grid; gap: 1px; margin: 2px 0 10px 22px; padding-left: 10px; border-left: 1px solid var(--line); }
.mod-toc a { font-size: 12.5px; line-height: 1.45; color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 6px; }
.mod-toc a:hover { color: var(--accent); background: var(--code-bg); }
article.mod { gap: 26px; }
article.mod p, article.mod li { line-height: 1.9; }
article.mod .blk { gap: 14px; padding-top: 26px; border-top: 1px solid var(--line); }
article.mod .blk > h3 { font-size: 19px; }
article.mod p > strong:first-child { color: var(--accent); }
article.mod ul.plain, article.mod ol.plain { gap: 10px; }
article.mod .selftest { margin-top: 6px; }
@media (max-width: 900px) { .mod-toc { display: none; } }
</style>

  <div class="in">

<script>
// 页面内容分文件存放（parts/），这里按 data-include 逐层取回、插入，然后依次执行内容里的脚本，最后加载 app.js（导航、日志筛选、刷题等）。
(function () {
  function include(root) {
    var els = Array.prototype.slice.call(root.querySelectorAll("[data-include]"));
    return Promise.all(els.map(function (el) {
      var path = el.getAttribute("data-include");
      return fetch(path, { cache: "no-cache" }).then(function (r) {
        if (!r.ok) throw new Error(path + "（" + r.status + "）");
        return r.text();
      }).then(function (html) {
        var t = document.createElement("template");
        t.innerHTML = html;
        return include(t.content).then(function () { el.replaceWith(t.content); });
      });
    }));
  }
  function runScripts() {
    Array.prototype.slice.call(document.querySelectorAll(".wrap script")).forEach(function (old) {
      var s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }
  var status = document.getElementById("boot-status");
  include(document).then(function () {
    runScripts();
    // app.js 用 fetch 取文本再执行：fetch 固定按 UTF-8 解码，不受服务器声明的编码影响
    return fetch("app.js", { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("app.js（" + r.status + "）");
      return r.text();
    }).then(function (code) {
      var app = document.createElement("script");
      app.textContent = code;
      document.body.appendChild(app);
      if (status) status.remove();
    });
  }).catch(function (e) {
    if (status) status.textContent = "内容没有加载成功：" + e.message + "。请刷新页面。";
  });
})();
</script>
